name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Unit and overlay tests (kubectl kustomize renders every fault)
        run: |
          kubectl version --client
          python -m unittest discover -s tests -v

  e2e:
    # Every fault on a real cluster: break it, observe the symptom, heal, check.
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install kind
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o kind \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind version
      - name: Break, observe, heal
        run: lab/lab.sh e2e
      - name: Cluster state on failure
        if: failure()
        run: lab/lab.sh status || true
