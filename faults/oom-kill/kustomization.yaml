apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s/base
patches:
  - target:
      kind: Deployment
      name: orders
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CACHE_WARMUP_MB
          value: "200"
